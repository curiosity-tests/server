
# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input so racecar can drive the run and pick
#      baseline vs instrumented.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action; `chalk:` is the only variable separating the arms.
#   3. permissions: id-token: write for the action's OIDC connect (the block
#      zeroes unlisted scopes, so everything upstream relied on is restated).
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      leaving fail-fast on cancels instrumented siblings more often than
#      baseline ones and biases the comparison.
#   6. the concurrency group carries the leg. Both arms run on the same ref, so
#      upstream's github.ref-keyed group put them in one group and the second
#      dispatch cancelled the first. Also cancellation-only, never a build change.
# Build and test COMMANDS are unchanged from upstream.
# SPDX-FileCopyrightText: 2026 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: PHPUnit

run-name: "PHPUnit ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
  schedule:
    - cron: "5 2 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: phpunit-${{ github.head_ref || github.run_id }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

# GitHub allows a maximum of 20 reusable workflows per caller
env:
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    outputs:
      src: ${{ steps.changes.outputs.src }}
      resources: ${{ steps.changes.outputs.resources }}
      kvstore: ${{ steps.changes.outputs.kvstore }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - '3rdparty/**'
              - '**/appinfo/**'
              - '**/lib/**'
              - '**/templates/**'
              - '**/tests/**'
              - 'vendor/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'
              - '**.php'
            resources:
              - 'resources/**'
            kvstore:
              - '.github/workflows/phpunit-kvstore.yml'
              - '3rdparty/**'
              - '**/appinfo/**'
              - '**.php'

  mariadb:
    needs: changes
    if: needs.changes.outputs.src != 'false'
    uses: ./.github/workflows/phpunit-mariadb.yml

  memcached:
    needs: changes
    if: needs.changes.outputs.src != 'false'
    uses: ./.github/workflows/phpunit-memcached.yml

  mysql:
    needs: changes
    if: needs.changes.outputs.src != 'false'
    uses: ./.github/workflows/phpunit-mysql.yml

  mysql-sharding:
    needs: changes
    if: needs.changes.outputs.src != 'false'
    uses: ./.github/workflows/phpunit-mysql-sharding.yml

  object-store-primary:
    needs: changes
    if: needs.changes.outputs.src != 'false'
    uses: ./.github/workflows/phpunit-object-store-primary.yml

  oci:
    needs: changes
    if: needs.changes.outputs.src != 'false'
    uses: ./.github/workflows/phpunit-oci.yml

  pgsql:
    needs: changes
    if: needs.changes.outputs.src != 'false'
    uses: ./.github/workflows/phpunit-pgsql.yml

  sqlite:
    needs: changes
    if: needs.changes.outputs.src != 'false'
    uses: ./.github/workflows/phpunit-sqlite.yml

  nodb:
    needs: changes
    if: needs.changes.outputs.src != 'false' || needs.changes.outputs.resources != 'false'
    uses: ./.github/workflows/phpunit-nodb.yml

  kvstore:
    needs: changes
    if: needs.changes.outputs.kvstore != 'false'
    uses: ./.github/workflows/phpunit-kvstore.yml

  summary:
    permissions:
      contents: none
      id-token: write
    runs-on: ubuntu-latest
    needs: [changes, mariadb, memcached, mysql, mysql-sharding, object-store-primary, oci, pgsql, sqlite, nodb, kvstore]

    if: always()

    name: phpunit-summary

    steps:
      # Skipped jobs are fine, they mean no relevant changes were detected
      - name: Summary status
        run: if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
