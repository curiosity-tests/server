
# racecar fork-testbed patch. Changes from upstream:
#   1. a `leg` workflow_call input, forwarded by the calling workflow. Neither
#      env nor inputs cross a workflow_call boundary, so this workflow has to
#      recompute CHALK_ON from its own input.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action; `chalk:` is the only variable separating the arms.
#   3. permissions: id-token: write for the action's OIDC connect (the block
#      zeroes unlisted scopes, so everything upstream relied on is restated).
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      leaving fail-fast on cancels instrumented siblings more often than
#      baseline ones and biases the comparison.
#   6. the concurrency group carries the leg. Both arms run on the same ref, so
#      upstream's github.ref-keyed group put them in one group and the second
#      dispatch cancelled the first. Also cancellation-only, never a build change.
# Build and test COMMANDS are unchanged from upstream.
# This workflow is provided via the organization template repository
#
# https://github.com/nextcloud/.github
# https://docs.github.com/en/actions/learn-github-actions/sharing-workflows-with-your-organization
#
# SPDX-FileCopyrightText: 2022-2024 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: PHPUnit OCI

on:
  workflow_call:
    inputs:
      leg:
        description: "baseline or instrumented, forwarded by the calling workflow"
        type: string
        required: false
        default: ""
      profile:
        description: "CrashOverride chalk profile"
        type: string
        required: false
        default: curiosity-tests-racecar

permissions:
  contents: read
  id-token: write

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  phpunit-oci:
    runs-on: ubuntu-latest

    if: ${{ github.repository_owner != 'nextcloud-gmbh' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - oracle-versions: '18'
            php-versions: '8.3'
          - oracle-versions: '23'
            php-versions: '8.5'

    name: Oracle ${{ matrix.oracle-versions }} (PHP ${{ matrix.php-versions }}) - database tests

    services:
      cache:
        image: ghcr.io/nextcloud/continuous-integration-redis:latest # zizmor: ignore[unpinned-images]
        ports:
          - 6379:6379/tcp
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

      oracle:
        image: ghcr.io/gvenzl/oracle-${{ matrix.oracle-versions < 23 && 'xe' || 'free'  }}:${{ matrix.oracle-versions }}

        # Provide passwords and other environment variables to container
        env:
          ORACLE_PASSWORD: oracle

        # Forward Oracle port
        ports:
          - 1521:1521

        # Provide healthcheck script options for startup
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout server
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
          submodules: true

      - name: Assert instrumentation is live
        # Socket existence, not LD_PRELOAD: co-monitor's loader clears
        # LD_PRELOAD once it has injected, so an empty value is what success
        # looks like. co-hostd also daemonizes, so pgrep does not match it.
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }


      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        timeout-minutes: 5
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, redis, session, simplexml, xmlreader, xmlwriter, zip, zlib, oci8
          coverage: none
          ini-file: development
          ini-values: disable_functions=""
        env:
          fail-fast: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up dependencies
        run: composer i

      - name: Set up Nextcloud
        run: |
          mkdir data
          cp tests/redis.config.php config/
          cp tests/preseed-config.php config/config.php
          ./occ maintenance:install --verbose --database=oci --database-name=${{ matrix.oracle-versions < 23 && 'XE' || 'FREE'  }} --database-host=127.0.0.1 --database-port=1521 --database-user=system --database-pass=oracle --admin-user admin --admin-pass admin
          php -f tests/enable_all.php

      - name: PHPUnit
        run: composer run test:db -- --log-junit junit.xml

      - name: Run repair steps
        run: |
          ./occ maintenance:repair --include-expensive
